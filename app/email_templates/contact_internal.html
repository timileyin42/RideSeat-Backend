<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background-color:#EDE9FE;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:40px 16px;">
  <tr><td align="center">
    <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;width:100%;">

      <!-- HEADER -->
      <tr><td style="background:#4C1D95;border-radius:16px 16px 0 0;padding:32px 40px 28px;">
        <p style="margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:2px;color:#C4B5FD;text-transform:uppercase;">Internal — Contact Form</p>
        <p style="margin:0;font-family:Georgia,'Palatino Linotype',serif;font-style:italic;font-size:34px;font-weight:700;color:#FFFFFF;letter-spacing:-0.5px;">Rideway</p>
        <h1 style="margin:12px 0 0;font-size:22px;font-weight:700;color:#FFFFFF;line-height:1.3;">New message from {name}</h1>
      </td></tr>

      <!-- BODY -->
      <tr><td style="background:#FFFFFF;padding:36px 40px 32px;">

        <!-- SENDER DETAILS -->
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin:0 0 24px;">
          <tr>
            <td style="background:#F5F3FF;border-radius:12px;padding:18px 20px;">
              <p style="margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:1.5px;color:#7C3AED;text-transform:uppercase;">Sender details</p>
              <table role="presentation" cellspacing="0" cellpadding="0">
                <tr>
                  <td style="padding:4px 16px 4px 0;font-size:13px;font-weight:700;color:#374151;white-space:nowrap;">Name</td>
                  <td style="padding:4px 0;font-size:13px;color:#6B7280;">{name}</td>
                </tr>
                <tr>
                  <td style="padding:4px 16px 4px 0;font-size:13px;font-weight:700;color:#374151;white-space:nowrap;">Email</td>
                  <td style="padding:4px 0;font-size:13px;color:#6B7280;"><a href="mailto:{email}" style="color:#7C3AED;text-decoration:none;">{email}</a></td>
                </tr>
              </table>
            </td>
          </tr>
        </table>

        <!-- MESSAGE -->
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin:0 0 28px;">
          <tr>
            <td style="background:#F5F3FF;border-left:4px solid #7C3AED;border-radius:0 12px 12px 0;padding:18px 20px;">
              <p style="margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:1.5px;color:#7C3AED;text-transform:uppercase;">Message</p>
              <p style="margin:0;font-size:14px;color:#374151;line-height:1.7;">{message}</p>
            </td>
          </tr>
        </table>

        <p style="margin:0;font-size:13px;color:#9CA3AF;line-height:1.5;">
          Reply directly to <a href="mailto:{email}" style="color:#7C3AED;text-decoration:none;">{email}</a> to respond to this message.
        </p>
      </td></tr>

      <!-- FOOTER -->
      <tr><td style="background:#F5F3FF;border-radius:0 0 16px 16px;padding:20px 40px;border-top:1px solid #E5E7EB;">
        <p style="margin:0;font-size:12px;color:#9CA3AF;line-height:1.5;text-align:center;">
          Rideway internal notification &mdash; do not forward.
        </p>
      </td></tr>

    </table>
  </td></tr>
</table>
</body>
</html>
